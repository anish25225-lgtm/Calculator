<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    /* CSS Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
    }

    .calculator {
      background-color: #333;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      width: 320px;
    }

    #display {
      width: 100%;
      height: 60px;
      background-color: #222;
      color: #fff;
      font-size: 2rem;
      border: none;
      border-radius: 5px;
      text-align: right;
      padding: 10px;
      margin-bottom: 20px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 50px;
      border: none;
      border-radius: 5px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      background-color: #e0e0e0;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #d4d4d4;
    }

    button:active {
      background-color: #ccc;
    }

    .operator {
      background-color: #ff9500;
      color: white;
    }

    .operator:hover {
      background-color: #e08300;
    }

    .clear {
      background-color: #ff3b30;
      color: white;
    }

    .clear:hover {
      background-color: #d32f2f;
    }

    .equal {
      background-color: #34c759;
      color: white;
      grid-column: span 2;
    }

    .equal:hover {
      background-color: #2eab4f;
    }
  </style>
</head>
<body>

  <!-- HTML Structure -->
  <div class="calculator">
    <input type="text" id="display" readonly value="0">
    
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendCharacter('/')">/</button>
      <button class="operator" onclick="appendCharacter('*')">*</button>

      <button onclick="appendCharacter('7')">7</button>
      <button onclick="appendCharacter('8')">8</button>
      <button onclick="appendCharacter('9')">9</button>
      <button class="operator" onclick="appendCharacter('-')">-</button>

      <button onclick="appendCharacter('4')">4</button>
      <button onclick="appendCharacter('5')">5</button>
      <button onclick="appendCharacter('6')">6</button>
      <button class="operator" onclick="appendCharacter('+')">+</button>

      <button onclick="appendCharacter('1')">1</button>
      <button onclick="appendCharacter('2')">2</button>
      <button onclick="appendCharacter('3')">3</button>
      <button class="equal" onclick="calculateResult()">=</button>

      <button onclick="appendCharacter('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendCharacter('.')">.</button>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    const display = document.getElementById('display');

    // Append characters to display
    function appendCharacter(val) {
      if (display.value === '0' || display.value === 'Error') {
        display.value = val;
      } else {
        display.value += val;
      }
    }

    // Clear display
    function clearDisplay() {
      display.value = '0';
    }

    // Delete last character
    function deleteLast() {
      if (display.value === 'Error' || display.value.length === 1) {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    // Evaluate mathematical expression safely
    function calculateResult() {
      try {
        // eval executes string expressions
        display.value = eval(display.value);
      } catch (error) {
        display.value = 'Error';
      }
    }
  </script>

</body>
</html>
